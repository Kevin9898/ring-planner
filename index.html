<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
  <title>링 계획표</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="링 계획표">
  <link rel="stylesheet" href="style.css?v=21">
  <script>
    // 저장된 화면 모드(밝게/어둡게)를 그리기 전에 적용해 깜빡임을 막는다.
    try {
      var savedTheme = JSON.parse(localStorage.getItem('ringplan.v1')).settings.theme;
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
        document.querySelector('meta[name="color-scheme"]').content = savedTheme === 'light' ? 'only light' : 'dark';
      }
    } catch (e) {}
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
  </script>
</head>
<body>
  <header class="top">
    <h1>링 계획표</h1>
    <nav class="tabs">
      <button class="tab on" data-view="ring">링</button>
      <button class="tab" data-view="todos">할 일</button>
    </nav>
  </header>

  <main>
    <section id="view-ring">
      <div class="datebar">
        <button id="prevDay" class="icon" aria-label="전날">‹</button>
        <button id="dateBtn" class="datebtn"><span id="dateText"></span></button>
        <button id="nextDay" class="icon" aria-label="다음 날">›</button>
        <button id="todayBtn">오늘</button>
      </div>

      <div class="gbar"><span id="gStatus"></span><button id="gBtn" class="small"></button></div>
      <div id="allDay" class="allday"></div>

      <div class="ringwrap">
        <svg id="ring" viewBox="0 0 400 400" role="img" aria-label="24시간 링"></svg>
        <div id="center" class="center"></div>
      </div>

      <div id="selbar" class="selbar"></div>

      <div class="actions">
        <button id="addBlockBtn" class="primary">+ 일정</button>
        <button id="pickTodoBtn">할 일에서 추가</button>
        <button id="templateBtn">템플릿</button>
        <button id="modeBtn"></button>
      </div>

      <ul id="dayList" class="daylist"></ul>

      <div id="dayTodos" class="daytodos">
        <h3 id="dayTodosHead"></h3>
        <ul id="dayTodoList" class="checklist"></ul>
      </div>

      <details class="settings">
        <summary>설정 · 백업</summary>
        <div class="settings-body">
          <div class="themesw" id="themeSw" role="group" aria-label="화면 모드">
            <button data-theme-set="auto">기기 설정</button>
            <button data-theme-set="light">밝게</button>
            <button data-theme-set="dark">어둡게</button>
          </div>
          <label>시간 단위
            <select id="snapSel">
              <option value="5">5분</option>
              <option value="10">10분</option>
              <option value="15">15분</option>
              <option value="30">30분</option>
            </select>
          </label>
          <button id="exportBtn">백업 파일 내보내기</button>
          <button id="importBtn">백업 파일 가져오기</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
          <div style="width:100%; display:flex; align-items:center; gap:8px; flex-wrap:wrap">
            <button id="refreshBtn" class="small">앱 새로 받기</button>
            <span id="versionText" class="note" style="margin:0"></span>
          </div>
          <div style="width:100%">
            <h4>Todoist 연동</h4>
            <div id="tdOff" class="row">
              <input type="password" id="tdToken" placeholder="Todoist API 토큰 붙여넣기" autocomplete="off">
              <button id="tdConnect">연결</button>
            </div>
            <div id="tdOn" hidden>
              <button id="tdSync" class="small">지금 동기화</button>
              <button id="tdDisconnect" class="small danger">Todoist 연결 해제</button>
            </div>
            <p id="tdState" class="note"></p>
          </div>
          <div id="gSettings" hidden style="width:100%">
            <h4>링에 함께 표시할 구글 캘린더 (읽기 전용)</h4>
            <ul id="calList" class="callist"></ul>
            <button id="gDisconnect" class="small danger">구글 연결 해제</button>
          </div>
        </div>
      </details>
    </section>

    <section id="view-todos" hidden>
      <div id="tStatus" class="gbar" hidden></div>
      <form id="todoForm" class="todoform">
        <input id="tTitle" placeholder="해야 할 일" required autocomplete="off">
        <label>마감 <input type="date" id="tDue"></label>
        <label>예상 <input id="tEst" class="est" value="1시간" placeholder="예: 90, 1시간 30분" autocomplete="off"></label>
        <button class="primary">추가</button>
      </form>
      <div class="viewsw">
        <button class="small" data-tv="board">보드</button>
        <button class="small" data-tv="list">목록</button>
      </div>
      <div id="weekNav" class="datebar weeknav">
        <button id="weekPrev" class="icon" aria-label="이전 주">‹</button>
        <span id="weekText" class="weektext"></span>
        <button id="weekNext" class="icon" aria-label="다음 주">›</button>
        <button id="weekNow">이번 주</button>
      </div>
      <div id="todoBoard" class="board"></div>
      <ul id="todoList" class="todolist"></ul>
    </section>
  </main>

  <dialog id="dlgBlock">
    <form id="blockForm">
      <h2 id="blockHead">일정</h2>
      <input id="bTitle" placeholder="일정 이름" required autocomplete="off">
      <div class="row">
        <label>날짜 <input type="date" id="bDate" required></label>
      </div>
      <div class="row">
        <label>시작 <input type="time" id="bStart" required></label>
        <label>종료 <input type="time" id="bEnd" required></label>
      </div>
      <p id="bNote" class="note"></p>
      <div id="bColors" class="swatches"></div>
      <div class="dlgbtns">
        <button type="button" id="bDelete" class="danger">삭제</button>
        <span class="sp"></span>
        <button type="button" id="bCancel">취소</button>
        <button class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgTodo">
    <form id="todoEditForm">
      <h2>할 일 수정</h2>
      <input id="eTitle" required autocomplete="off">
      <div class="row">
        <label>마감 <input type="date" id="eDue"></label>
        <label>예상 <input id="eEst" class="est" placeholder="예: 90, 1시간 30분" autocomplete="off"></label>
      </div>
      <div class="dlgbtns">
        <button type="button" id="eDelete" class="danger">삭제</button>
        <span class="sp"></span>
        <button type="button" id="eCancel">취소</button>
        <button class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgPick">
    <h2>할 일에서 추가</h2>
    <p class="note">체크한 일을 이 날짜의 빈 시간에 넣습니다. 넣은 뒤 꾹 눌러 옮기면 됩니다.</p>
    <ul id="pickList" class="picklist"></ul>
    <div class="dlgbtns">
      <span class="sp"></span>
      <button type="button" id="pickCancel">닫기</button>
      <button type="button" id="pickAdd" class="primary">링에 추가</button>
    </div>
  </dialog>

  <dialog id="dlgTpl">
    <h2>템플릿</h2>
    <form id="tplForm" class="row">
      <input id="tplName" placeholder="템플릿 이름 (예: 평일)" required autocomplete="off">
      <button class="primary">현재 링 저장</button>
    </form>
    <ul id="tplList" class="tpllist"></ul>
    <div class="dlgbtns">
      <span class="sp"></span>
      <button type="button" id="tplClose">닫기</button>
    </div>
  </dialog>

  <dialog id="dlgCal" class="caldlg">
    <div class="calhead">
      <button id="calPrev" class="icon" aria-label="이전 달">‹</button>
      <b id="calTitle"></b>
      <button id="calNext" class="icon" aria-label="다음 달">›</button>
    </div>
    <div id="calGrid" class="calgrid"></div>
    <div class="dlgbtns">
      <button type="button" id="calToday">오늘</button>
      <span class="sp"></span>
      <button type="button" id="calClose">닫기</button>
    </div>
  </dialog>

  <dialog id="dlgChoose">
    <p id="chooseMsg"></p>
    <div id="chooseBtns" class="dlgbtns"></div>
  </dialog>

  <script src="js/store.js?v=21"></script>
  <script src="js/ring.js?v=21"></script>
  <script src="js/gcal.js?v=21"></script>
  <script src="js/todoist.js?v=21"></script>
  <script src="js/app.js?v=21"></script>
</body>
</html>
